# nginx site: HTTPS in front of the application (which listens on 127.0.0.1:8495).
#   sudo cp deploy/nginx/nginx-dbms.conf /etc/nginx/sites-available/dbms
#   sudo ln -s /etc/nginx/sites-available/dbms /etc/nginx/sites-enabled/dbms
#   edit server_name and the two certificate paths, then: sudo nginx -t && sudo systemctl reload nginx
# In .env set: DBMS_BEHIND_PROXY=1, DBMS_SECURE_COOKIES=1, DBMS_FORCE_HTTPS=1,
#              DJANGO_CSRF_TRUSTED_ORIGINS=https://your-name-or-ip
limit_req_zone $binary_remote_addr zone=vault_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=vault_api:10m rate=120r/m;

server {
    listen 80;
    server_name backup.example.com;
    server_tokens off;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name backup.example.com;
    server_tokens off;

    ssl_certificate     /etc/ssl/certs/dbms.crt;
    ssl_certificate_key /etc/ssl/private/dbms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;

    client_max_body_size 3m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    location /login {
        limit_req zone=vault_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8495;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=vault_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8495;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8495;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }
}
